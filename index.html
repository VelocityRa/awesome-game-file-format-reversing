<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Awesome Game File Format Reversing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Curated collection of resources for reversing game file formats."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='14'%3E🎮%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple-dark.css"
    />
    <style>
      /* Dark only — no light variant is loaded, so nothing to toggle. */
      :root {
        /* Density: the list is ~10k lines, so tighten the vertical rhythm. */
        --base-font-size: 15.5px;
        --base-line-height: 1.45;
        --content-max-width: 62em;
        --heading-margin: 1.6rem 0 0.4rem;
        --heading-h1-font-size: var(--font-size-xl);
        --heading-h2-font-size: var(--font-size-l);
        --heading-h2-margin: 2rem 0 0.8rem;
        --heading-h2-padding: 0 0 0.5rem 0;
        --heading-h3-font-size: calc(var(--font-size-m) * 1.15);
        --heading-h4-font-size: var(--font-size-m);
        --sidebar-width: 18rem;
        --sidebar-nav-link-padding: 0.1em 0;
        --sidebar-nav-margin: 1rem 0 0;
        --sidebar-name-margin: 1rem 0 0;
        --blockquote-padding: 0.8em 1.2em;
        --code-block-padding: 1em 1.2em;
      }

      .markdown-section {
        padding: 20px 24px 48px;
      }
      .markdown-section p {
        margin: 0.6em 0;
      }
      .markdown-section ul,
      .markdown-section ol {
        margin: 0.4em 0;
        padding-left: 1.35em;
      }
      .markdown-section li,
      .markdown-section li > ul,
      .markdown-section li > ol {
        margin: 0.1em 0;
      }
      .markdown-section hr {
        margin: 1.2em 0;
      }
      .markdown-section blockquote {
        margin: 0.8em 0;
      }

      /* Navbar submenus hold full section names, so give them room. */
      .app-nav li ul {
        min-width: 15em;
        background: var(--mono-tint1);
      }

      /* The sidebar mirrors a long outline; wrap long section names instead of
         truncating them ("Format Analysis & Reverse Engi…"). */
      .sidebar-nav li {
        margin: 0;
      }
      .sidebar-nav a {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }
      .sidebar-nav > ul > li > a {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      /**
       * Docsify slugifies headings differently from GitHub: it keeps emoji,
       * turns "&" into "amp" (it slugifies the HTML-escaped text) and collapses
       * runs of hyphens. Every anchor in README.md, _sidebar.md and _navbar.md
       * is a GitHub anchor, so none of them resolved. Re-id the headings with
       * GitHub's algorithm (a port of github-slugger) so those links work.
       */
      function makeGithubSlugger() {
        var seen = Object.create(null);
        return function (text) {
          var base = String(text)
            .trim()
            .toLowerCase()
            .replace(/[^\p{L}\p{N}\p{M}\p{Pc}\- ]/gu, '')
            .replace(/ /g, '-');
          if (seen[base] === undefined) {
            seen[base] = 0;
            return base;
          }
          return base + '-' + ++seen[base];
        };
      }

      // GitHub anchors can start with a digit ("3d-models--viewers") or a
      // hyphen, which docsify feeds straight into querySelector('#' + id).
      // A leading digit is not a valid CSS selector, so fall back to getElementById.
      (function () {
        var native = Document.prototype.querySelector;
        Document.prototype.querySelector = function (selector) {
          try {
            return native.call(this, selector);
          } catch (err) {
            if (typeof selector === 'string' && selector.charAt(0) === '#') {
              return this.getElementById(selector.slice(1));
            }
            throw err;
          }
        };
      })();

      var searchSlugger = makeGithubSlugger();

      function githubAnchorsPlugin(hook) {
        hook.afterEach(function (html, next) {
          var doc = new DOMParser().parseFromString(
            '<div id="dsroot">' + html + '</div>',
            'text/html'
          );
          var root = doc.getElementById('dsroot');
          if (!root) {
            return next(html);
          }
          var slugify = makeGithubSlugger();
          var headings = root.querySelectorAll('h1, h2, h3, h4, h5, h6');
          for (var i = 0; i < headings.length; i++) {
            var heading = headings[i];
            var id = slugify(heading.textContent || '');
            if (!id) {
              continue;
            }
            heading.id = id;
            var anchor = heading.querySelector('a.anchor');
            if (anchor) {
              anchor.setAttribute('data-id', id);
              anchor.setAttribute(
                'href',
                (anchor.getAttribute('href') || '').replace(
                  /\?id=.*$/,
                  '?id=' + encodeURIComponent(id)
                )
              );
            }
          }
          next(root.innerHTML);
        });
      }

      window.$docsify = {
        name: 'Awesome Game File Format Reversing',
        repo: 'https://github.com/VelocityRa/awesome-game-file-format-reversing',
        homepage: 'README.md',
        loadNavbar: true,
        loadSidebar: true,
        coverpage: true,
        maxLevel: 4,
        search: 'auto',
        plugins: [githubAnchorsPlugin]
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script>
      // The search plugin builds its result links with Docsify.slugify, so it
      // has to agree with the heading ids the plugin above writes. It calls
      // .clear() before indexing a page, which is what resets the "-1"/"-2"
      // suffix counters for duplicate headings.
      // Search hands over HTML-escaped text ("A &amp; B"), while the heading
      // ids above are built from textContent, so decode first or "&" would
      // slugify to "amp" here and to nothing there.
      var entityDecoder = document.createElement('textarea');

      window.Docsify.slugify = function (text) {
        entityDecoder.innerHTML = String(text);
        return searchSlugger(entityDecoder.value);
      };
      window.Docsify.slugify.clear = function () {
        searchSlugger = makeGithubSlugger();
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
