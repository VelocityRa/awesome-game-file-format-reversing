# Builds the GitHub Pages site at https://velocityra.github.io/awesome-game-file-format-reversing
#
# README.md is the single source of truth. `site_build/gen_pages.py` splits it
# into the page tree at build time via mkdocs-gen-files, and writes the SUMMARY.md
# that mkdocs-literate-nav turns into the nav -- so nothing generated is committed
# and the nav can never go stale against the README's headings.
#
#   uv run --with-requirements requirements-docs.txt --no-project mkdocs serve
#   uv run --with-requirements requirements-docs.txt --no-project mkdocs build --strict
#
# Design notes: docs/superpowers/specs/2026-07-30-mkdocs-material-site-design.md

site_name: Awesome Game File Format Reversing
site_url: https://velocityra.github.io/awesome-game-file-format-reversing/
site_description: >-
  A curated collection of documentation, code, tools, and resources for reverse
  engineering and working with video game file formats.
site_author: Nick Renieris
copyright: >-
  Released under <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a>

repo_url: https://github.com/VelocityRa/awesome-game-file-format-reversing
repo_name: VelocityRa/awesome-game-file-format-reversing
# The generated pages have no source file of their own, so point every "edit"
# action at the one file that is actually editable. A template with no {path}
# placeholder resolves to a constant URL.
edit_uri_template: blob/master/README.md

# Holds only theme assets; every content page is generated by gen_pages.py.
docs_dir: site_src

theme:
  name: material
  language: en
  icon:
    logo: material/gamepad-variant
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    # Dark first -- the docsify site it replaces was dark-only.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    # Top-level nav entries become tabs in the header.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.path        # breadcrumbs (free since 9.7)
    - navigation.top
    - navigation.tracking
    - navigation.footer
    # SPA-style navigation, so moving between pages does not re-download the theme.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VelocityRa/awesome-game-file-format-reversing
      name: This list on GitHub

plugins:
  - search
  - gen-files:
      scripts:
        - site_build/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

# Runs after the plugins above, so the nav is already resolved when it removes
# the generated SUMMARY.md from the output.
hooks:
  - site_build/hooks.py

markdown_extensions:
  # attr_list carries the explicit {#github-slug} ids gen_pages.py puts on every
  # heading; toc then honours them verbatim, so the site's anchors are GitHub's.
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 4
# Deliberately absent: pymdownx.smartsymbols (would rewrite "(c)"/"(tm)" inside
# format names) and pymdownx.magiclink (would rewrite bare URLs in tool
# descriptions).

# --strict promotes these to errors, so a heading rename that orphans an
# in-document anchor fails the build instead of shipping a dead link.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
