name: "Deploy site to GitHub Pages"
run-name: Building site from "${{ github.ref_name }}"

# The site is generated from README.md by site_build/gen_pages.py at build time
# (see mkdocs.yml), so it must be rebuilt whenever README.md or the build config
# changes. Pages "Source" must be set to GitHub Actions, not a branch.
on:
  push:
    branches: [master]
    paths:
      - README.md
      - mkdocs.yml
      - requirements-docs.txt
      - site_build/**
      - site_src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-flight one, but never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict promotes MkDocs' link and anchor validation warnings to errors,
      # so a heading rename that orphans an in-document anchor fails here rather
      # than shipping a dead link.
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
